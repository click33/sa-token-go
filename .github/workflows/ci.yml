name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: |
          for dir in $(go work edit -json | python3 -c "import sys,json; [print(m['DiskPath']) for m in json.load(sys.stdin).get('Use',[])]"); do
            case "$dir" in ./examples*|./demo*) continue ;; esac
            echo "=== lint $dir ==="
            (cd "$dir" && golangci-lint run ./...) || exit 1
          done

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Go vet
        run: |
          for dir in $(go work edit -json | python3 -c "import sys,json; [print(m['DiskPath']) for m in json.load(sys.stdin).get('Use',[])]"); do
            echo "=== vet $dir ==="
            (cd "$dir" && go vet ./...) || exit 1
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Run tests
        run: |
          for dir in $(go work edit -json | python3 -c "import sys,json; [print(m['DiskPath']) for m in json.load(sys.stdin).get('Use',[])]"); do
            echo "=== test $dir ==="
            (cd "$dir" && go test -race -coverprofile=coverage.out -covermode=atomic ./...) || exit 1
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build all modules
        run: |
          for dir in $(go work edit -json | python3 -c "import sys,json; [print(m['DiskPath']) for m in json.load(sys.stdin).get('Use',[])]"); do
            echo "=== build $dir ==="
            (cd "$dir" && go build ./...) || exit 1
          done
